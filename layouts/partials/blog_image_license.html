<figure class="license">
  {{/* Empty alt tag because title is provided as figcaption */}}
  <img src="{{.Params.image.src}}" alt="">
  {{ if (or .Params.image.license .Params.image.title) }}
  <figcaption>{{ with .Params.image.title }}{{.}}{{end}}
      {{ with .Params.image.title }}{{ . }}{{ end }}
      {{ with .Params.image.license }} ({{ . }}){{ end }}
  </figcaption>
  {{ end }}
</figure>
